spring.application.name=dsa
# MySQL DB connection
spring.datasource.url=jdbc:mysql://localhost:3306/dsa?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA - we created tables manually so use 'none'
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JWT settings (use env vars in production)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

#Hibernate property to turn off creating session even before jwt filter runs
spring.jpa.open-in-view=false

server.tomcat.threads.max=10
logging.level.com.haneen.dsa=DEBUG
